<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marées St-Malo">
<title>Marées de Saint-Malo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--cy:#2bc4ff;--gr:#19d79a;--or:#ff5a1f;--txt:#eaf3ff;--mut:#8fb0d0;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.14)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--txt);
    background:radial-gradient(1200px 620px at 50% -8%,#0b3c7c 0%,#04122b 58%,#020b1c 100%) fixed;
    padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom));
    max-width:720px;margin:0 auto}
  .card{background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:12px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.28)}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:44px;height:44px;flex:none}
  h1{margin:0;font-size:1.45rem;line-height:1.05;font-weight:800;letter-spacing:.2px;text-transform:uppercase}
  header img{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
  .daterow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .navbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--bd);background:var(--glass);color:var(--txt);font-size:1rem;cursor:pointer}
  .navbtn:active{background:rgba(255,255,255,.18)}
  .datepill{position:relative;flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.09);
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 14px;font-weight:600;overflow:hidden}
  .datepill .dtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.02rem}
  .coefbadge{flex:none;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.86rem;color:#fff;background:#14808f;white-space:nowrap}
  .datepill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .thr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .thr-top label{font-size:1.15rem;font-weight:600}
  .orpill{display:flex;align-items:baseline;gap:4px;background:linear-gradient(180deg,#ff7a3d,#ff4a10);border-radius:999px;padding:5px 16px;box-shadow:0 0 18px rgba(255,90,31,.55)}
  .orpill input{width:3.3rem;border:0;background:transparent;color:#fff;font:inherit;font-weight:800;font-size:1.15rem;text-align:right;padding:0;outline:none;-moz-appearance:textfield}
  .orpill input::-webkit-outer-spin-button,.orpill input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .orpill span{font-weight:800;font-size:1.15rem}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;outline:none;background:#27415f}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a6a,#ff4a10);box-shadow:0 0 14px rgba(255,90,31,.9);border:0;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#ff4a10;border:0;box-shadow:0 0 14px rgba(255,90,31,.9)}
  #wrap{position:relative;height:360px;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{width:100%;height:100%;display:block}
  #info{font-size:.95rem;margin-top:8px;min-height:1.4em}
  .ttl{font-size:1.2rem;font-weight:700;margin:0 0 8px}
  .ttl b{color:var(--or)}
  .day{margin-bottom:12px}
  .day h3{margin:0 0 6px;font-size:.98rem;text-transform:capitalize;color:var(--mut);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 15px;border-radius:999px;font-size:1.02rem;font-weight:600}
  .chip.ok{background:linear-gradient(180deg,#27e0a6,#12b886);color:#03261b}
  .chip.no{background:rgba(255,255,255,.08);color:var(--mut)}
  .small{font-size:.8rem;color:var(--mut);line-height:1.45}
  .est{color:#f0c040;font-weight:700}
  .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .wbox{background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;min-height:84px}
  .wbox .lab{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .wbox .val{font-size:1.5rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .wbox .sub{font-size:.82rem;color:var(--mut);margin-top:2px}
  .arrow{width:30px;height:30px;flex:none}
  .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .tile{flex:0 0 86px;scroll-snap-align:start;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer}
  .tile.sel{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy) inset}
  .tile .d{font-size:.78rem;color:var(--mut);text-transform:capitalize}
  .tile .w{font-weight:800;font-size:.98rem;display:flex;justify-content:center;align-items:center;gap:4px;margin:4px 0 2px}
  .tile .h{font-size:.86rem;color:#9fe3ff;font-weight:700}
  .tile .c{font-size:.74rem;color:var(--mut)}
  #gate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 600px at 50% 0%,#0b3c7c 0%,#04122b 60%,#020b1c 100%)}
  #gate .box{width:100%;max-width:380px;text-align:center}
  #gate img{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 10px 40px rgba(0,0,0,.5)}
  #gate h2{margin:16px 0 6px;font-size:1.4rem}
  #gate p{margin:0 0 16px;color:var(--mut);font-size:.95rem}
  #gate input{width:100%;font:inherit;font-size:1.2rem;text-align:center;letter-spacing:2px;text-transform:uppercase;padding:13px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.1);color:var(--txt);outline:none}
  #gate button{margin-top:12px;width:100%;font:inherit;font-size:1.1rem;font-weight:800;padding:13px;border:0;border-radius:14px;color:#03261b;background:linear-gradient(180deg,#27e0a6,#12b886);cursor:pointer}
  #gate .err{min-height:1.4em;margin-top:10px;color:#ff9b7a;font-size:.95rem}
  #app{display:none}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <img src="logo.png" alt="Marées Saint-Malo">
    <h2>Accès réservé</h2>
    <p>Saisis ton code d’accès personnel.</p>
    <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE">
    <button id="codeBtn">Entrer</button>
    <div class="err" id="codeErr"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 40c8 0 8-8 16-8s8 8 16 8 8-8 16-8" fill="none" stroke="#2bc4ff" stroke-width="5" stroke-linecap="round"/><path d="M6 52c8 0 8-8 16-8s8 8 16 8 8-8 16-8" fill="none" stroke="#19d79a" stroke-width="5" stroke-linecap="round" opacity=".85"/><path d="M12 28c0-12 10-20 22-16-8 2-10 8-8 16" fill="#2bc4ff" opacity=".9"/></svg>
    <h1>Marées de<br>Saint-Malo</h1>
  </div>
  <img src="logo.png" alt="Logo">
</header>

<div class="daterow">
  <button class="navbtn" id="prev" aria-label="Jour précédent">◀</button>
  <div class="datepill">
    <span class="dtxt" id="dtxt">—</span>
    <span class="coefbadge" id="coefbadge">Coef —</span>
    <input id="date" type="date" aria-label="Choisir une date">
  </div>
  <button class="navbtn" id="next" aria-label="Jour suivant">▶</button>
</div>

<div class="card">
  <div class="thr-top">
    <label for="thrNum">Mon seuil d’eau</label>
    <div class="orpill"><input id="thrNum" type="number" inputmode="decimal" step="0.1" min="0" max="13" value="4"><span>m</span></div>
  </div>
  <input id="thrRange" type="range" min="0" max="13" step="0.1" value="4">
</div>

<div class="card">
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="info" class="small"></div>
</div>

<div class="card">
  <div class="ttl">Créneaux <b>au-dessus</b> de <b id="thrLbl">4,0 m</b></div>
  <div id="list"></div>
</div>

<div class="card">
  <div class="ttl">Vent et houle</div>
  <div id="wx"><div class="small">Chargement de la météo…</div></div>
</div>

<div class="card small" id="foot"></div>
</div>

        if(p&&p.hourly&&p.hourly.wave_height&&p.hourly.wave_height.some(v=>typeof v==="number")){sea={t:p.hourly.time.map(parseLocal),wh:p.hourly.wave_height};break;}
      }
    }
    if(wx)WX=wx;if(sea)SEA=sea;
    if(wx||sea){try{localStorage.setItem("maree-wx",JSON.stringify({at:Date.now(),wx:WX,sea:SEA}));}catch(e){}}
  }catch(e){}
  renderWx();draw();
}
function nearestIdx(arr,ms){ // arr trié
  if(!arr||!arr.length)return -1;
  let lo=0,hi=arr.length-1;
  if(ms<arr[0]-HOUR||ms>arr[hi]+HOUR)return -1;
  while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<ms)lo=m+1;else hi=m;}
  if(lo>0&&Math.abs(arr[lo-1]-ms)<Math.abs(arr[lo]-ms))lo--;
  return lo;
}
function dayWind(a,b){ // moyenne, rafale max, direction dominante (pondérée) sur [a,b[
  if(!WX)return null;
  let sx=0,sy=0,sum=0,cnt=0,gmax=0;
  for(let i=0;i<WX.t.length;i++){
    if(WX.t[i]>=a&&WX.t[i]<b&&typeof WX.ws[i]==="number"){
      const w=WX.ws[i],d=WX.wd[i]*RAD;sx+=w*Math.sin(d);sy+=w*Math.cos(d);sum+=w;cnt++;
      if(typeof WX.wg[i]==="number")gmax=Math.max(gmax,WX.wg[i]);
    }
  }
  if(!cnt)return null;
  let dir=Math.atan2(sx,sy)/RAD;if(dir<0)dir+=360;
  return {avg:sum/cnt,gust:gmax,dir:dir};
}
function daySwell(a,b){
  if(!SEA)return null;let mx=null,sm=0,c=0;
  for(let i=0;i<SEA.t.length;i++){
    const v=SEA.wh[i];
    if(SEA.t[i]>=a&&SEA.t[i]<b&&typeof v==="number"){mx=mx===null?v:Math.max(mx,v);sm+=v;c++;}
  }
  return c?{max:mx,avg:sm/c}:null;
}
function arrowSvg(dirFrom,color,size){
  const rot=(dirFrom+180)%360,sz=size||30;
  return '<svg class="arrow" viewBox="0 0 32 32" style="width:'+sz+'px;height:'+sz+'px;transform:rotate('+rot+'deg)"><path d="M16 3 L25 24 L16 19 L7 24 Z" fill="'+color+'" stroke="rgba(255,255,255,.55)" stroke-width="1"/></svg>';
}
function windColor(kmh){return kmh<20?"#19d79a":kmh<35?"#ffd34d":kmh<50?"#ff9a3d":"#ff4d4d";}

/* ================= ÉTAT ET OUTILS ================= */
const $=id=>document.getElementById(id);
const RANGE_MIN=Math.max(dayStart(Date.now()),dayStart(Tm[0]+DAY));
const RANGE_MAX=parisMidnight(2028,0,1);
let thr=4,span=24*HOUR,vStart=RANGE_MIN,cursor=null;
try{const s=JSON.parse(localStorage.getItem("maree-sm-v3")||"{}");if(typeof s.thr==="number")thr=s.thr;}catch(e){}
function saveThr(){try{localStorage.setItem("maree-sm-v3",JSON.stringify({thr}));}catch(e){}}
function selDay(){return dayStart(cursor!==null?cursor:vStart+span/2);}

/* ================= DESSIN ================= */
let cv,ctx,wrap,W=0,H=0,dpr=1;
const YMAX=15,PAD={l:36,r:10,t:12,b:26};
const xOf=t=>PAD.l+(t-vStart)/span*(W-PAD.l-PAD.r);
const tOf=x=>vStart+(x-PAD.l)/(W-PAD.l-PAD.r)*span;
const yOf=v=>PAD.t+(1-v/YMAX)*(H-PAD.t-PAD.b);
function resize(){
  dpr=window.devicePixelRatio||1;W=wrap.clientWidth;H=wrap.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw();
}
function clampView(){
  span=Math.max(6*HOUR,Math.min(span,14*DAY));
  vStart=Math.max(RANGE_MIN,Math.min(vStart,RANGE_MAX-span));
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function draw(){
  if(!ctx||!W)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const pw=W-PAD.l-PAD.r,ph=H-PAD.t-PAD.b,yb=H-PAD.b,yt=PAD.t;
  const cMut="#8fb0d0",cGrid="rgba(255,255,255,.10)";
  // jour / nuit
  ctx.save();ctx.beginPath();ctx.rect(PAD.l,yt,pw,ph);ctx.clip();
  const d0=addDays(dayStart(vStart),-1);
  const nights=[],days=[];
  for(let d=d0;d<=vStart+span+DAY;d=addDays(d,1)){
    const e=sunEvents(d),n=sunEvents(addDays(d,1));
    days.push([e.rise,e.set]);nights.push([e.set,n.rise]);
  }
  for(const [a,b] of days){ // jour : voile clair
    const x0=Math.max(PAD.l,xOf(a)),x1=Math.min(W-PAD.r,xOf(b));
    if(x1>x0){const g=ctx.createLinearGradient(0,yt,0,yb);g.addColorStop(0,"rgba(120,190,255,.16)");g.addColorStop(1,"rgba(120,190,255,.04)");ctx.fillStyle=g;ctx.fillRect(x0,yt,x1-x0,ph);}
  }
  // grille
  ctx.font="11px 'Segoe UI',system-ui,sans-serif";ctx.textBaseline="middle";
  for(let v=0;v<=14;v+=2){
    const y=yOf(v);ctx.strokeStyle=cGrid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();
  }
  ctx.restore();
  ctx.textAlign="right";ctx.fillStyle=cMut;ctx.textBaseline="middle";
  for(let v=0;v<=14;v+=2)ctx.fillText(v+" m",PAD.l-5,yOf(v));
  // axe du temps
  const pxh=pw/(span/HOUR);let step=12;for(const s of [1,2,3,6,12]){if(s*pxh>=44){step=s;break;}}
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.textAlign="center";ctx.textBaseline="top";
  if(span<=5*DAY){
    for(let t=dayStart(vStart);t<=vStart+span;t+=HOUR){
      if(t<vStart)continue;
      const hh=+fT.format(new Date(t)).slice(0,2);if(hh%step)continue;
      const x=xOf(t);
      ctx.strokeStyle=cGrid;ctx.beginPath();ctx.moveTo(x,yt);ctx.lineTo(x,yb);ctx.stroke();
      ctx.fillStyle=cMut;ctx.fillText(hh===0&&span>30*HOUR?fDS.format(new Date(t)):hh+"h",x,yb+6);
    }
  }else{
    for(let t=dayStart(vStart);t<=vStart+span;t=addDays(t,1)){
      if(t<vStart)continue;const x=xOf(t);
      ctx.strokeStyle=cGrid;ctx.beginPath();ctx.moveTo(x,yt);ctx.lineTo(x,yb);ctx.stroke();
      if(span<=9*DAY||ymd(t).d%2===1){ctx.fillStyle=cMut;ctx.fillText(fDS.format(new Date(t)),x,yb+6);}
    }
  }
  ctx.restore();
  // courbe
  const n=Math.max(2,Math.floor(pw));const pts=new Array(n+1);
  for(let i=0;i<=n;i++){const x=PAD.l+i;pts[i]=[x,yOf(height(tOf(x)))];}
  const ythr=yOf(thr);
  ctx.save();ctx.beginPath();ctx.rect(PAD.l,yt,pw,ph+1);ctx.clip();
  // remplissage sous la courbe
  ctx.beginPath();ctx.moveTo(pts[0][0],yb);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(pts[n][0],yb);ctx.closePath();
  let g=ctx.createLinearGradient(0,yt,0,yb);g.addColorStop(0,"rgba(43,196,255,.50)");g.addColorStop(1,"rgba(14,70,150,.10)");ctx.fillStyle=g;ctx.fill();
  // au-dessus du seuil : vert
  ctx.save();ctx.beginPath();ctx.rect(PAD.l,yt,pw,Math.max(0,ythr-yt));ctx.clip();
  ctx.beginPath();ctx.moveTo(pts[0][0],yb);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(pts[n][0],yb);ctx.closePath();
  g=ctx.createLinearGradient(0,yt,0,ythr);g.addColorStop(0,"rgba(25,215,154,.70)");g.addColorStop(1,"rgba(25,215,154,.28)");ctx.fillStyle=g;ctx.fill();ctx.restore();
  // trait : cyan sous le seuil, vert au-dessus ; pointillé dans la zone estimée
  const xe=xOf(LAST_REAL);
  function stroke(x0,x1,dash){
    if(x1<=x0)return;
    for(const pass of [0,1]){
      ctx.save();ctx.beginPath();
      if(pass===0)ctx.rect(x0,yt,x1-x0,Math.max(0,ythr-yt));else ctx.rect(x0,ythr,x1-x0,yb-ythr+2);
      ctx.clip();
      ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.strokeStyle=pass===0?"#2cf0b0":"#38c8ff";ctx.lineWidth=3;ctx.lineJoin="round";ctx.shadowColor=pass===0?"rgba(44,240,176,.8)":"rgba(56,200,255,.8)";ctx.shadowBlur=9;
      ctx.setLineDash(dash);ctx.stroke();ctx.restore();
    }
  }
  stroke(PAD.l,Math.min(xe,W-PAD.r),[]);
  if(xe<W-PAD.r)stroke(Math.max(xe,PAD.l),W-PAD.r,[7,5]);
  // seuil
  ctx.setLineDash([5,4]);ctx.strokeStyle="#ff5a1f";ctx.lineWidth=2;ctx.shadowColor="rgba(255,90,31,.9)";ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(PAD.l,ythr);ctx.lineTo(W-PAD.r,ythr);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=0;
  // nuit : noir par-dessus
  for(const [a,b] of nights){
    const x0=Math.max(PAD.l,xOf(a)),x1=Math.min(W-PAD.r,xOf(b));
    if(x1>x0){ctx.fillStyle="rgba(0,0,0,.58)";ctx.fillRect(x0,yt,x1-x0,ph);}
  }
  // zone estimée : repère
  if(xe<W-PAD.r){
    const xs=Math.max(xe,PAD.l);
    ctx.strokeStyle="rgba(240,192,64,.8)";ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(xs,yt);ctx.lineTo(xs,yb);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle="#f0c040";ctx.font="bold 11px 'Segoe UI',system-ui,sans-serif";ctx.textAlign="left";ctx.textBaseline="top";ctx.fillText("estimation",xs+6,yt+ph-18);
  }
  // maintenant
  const now=Date.now();
  if(now>=vStart&&now<=vStart+span){const x=xOf(now);ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(x,yt);ctx.lineTo(x,yb);ctx.stroke();ctx.setLineDash([]);}
  ctx.restore();
  // lune et soleil
  ctx.save();ctx.beginPath();ctx.rect(PAD.l,yt,pw,ph);ctx.clip();
  if(span<=4*DAY){
    const r=Math.min(15,Math.max(9,pw/(span/HOUR)*1.1));
    for(const [a,b] of nights){
      const x0=Math.max(PAD.l,xOf(a)),x1=Math.min(W-PAD.r,xOf(b));
      if(x1-x0>r*2.4)drawMoon(ctx,(x0+x1)/2,yt+r+8,r,moonAge((a+b)/2));
    }
    for(const [a,b] of days){
      const x0=Math.max(PAD.l,xOf(a)),x1=Math.min(W-PAD.r,xOf(b));
      if(x1-x0>r*2.4)drawSun(ctx,(x0+x1)/2,yt+r+8,r*.8);
    }
  }
  ctx.restore();
  // coefficients au sommet de chaque pleine mer
  ctx.save();ctx.beginPath();ctx.rect(PAD.l-4,0,pw+8,H);ctx.clip();
  ctx.font="bold 11px 'Segoe UI',system-ui,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  const i0=Math.max(0,idxAfter(vStart-3*HOUR)-1);
  for(let i=i0;i<N&&Tm[i]<=vStart+span+3*HOUR;i++){
    if(!CF[i]||!isHigh(i))continue;
    const x=xOf(Tm[i]);if(x<PAD.l-10||x>W-PAD.r+10)continue;
    const label=(EST[i]?"~":"")+CF[i],tw=ctx.measureText(label).width+12;
    const y=Math.max(yt+34,yOf(Hm[i])-18);
    roundRect(ctx,x-tw/2,y-9,tw,18,9);ctx.fillStyle=coefColor(CF[i]);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle="#fff";ctx.fillText(label,x,y+.5);
  }
  ctx.restore();
  // curseur
  if(cursor!==null&&cursor>=vStart&&cursor<=vStart+span){
    const x=xOf(cursor),v=height(cursor),y=yOf(v);
    ctx.strokeStyle="#2f9bff";ctx.lineWidth=2;ctx.shadowColor="rgba(47,155,255,.9)";ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(x,yt);ctx.lineTo(x,yb);ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle="#0a2a5a";ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
  }
  updateInfo();
}
function updateInfo(){
  const mid=cursor!==null?cursor:vStart+span/2,v=height(mid);
  let extra="";
  const wi=nearestIdx(WX&&WX.t,mid);
  if(wi>=0&&typeof WX.ws[wi]==="number")extra+=" · vent "+Math.round(WX.ws[wi])+" km/h "+cardinal(WX.wd[wi]);
  const si=nearestIdx(SEA&&SEA.t,mid);
  if(si>=0&&typeof SEA.wh[si]==="number")extra+=" · houle "+n1(SEA.wh[si])+" m";
  $("info").innerHTML=(cursor!==null?"📍 ":"Centre : ")+"<b>"+cap(fDS.format(new Date(mid)))+" à "+hhmm(mid)+"</b> — <b>"+nf(v)+" m</b> "+
    (v>=thr?'<span style="color:#2cf0b0">(au-dessus du seuil)</span>':'<span style="color:#ff8a5c">(sous le seuil)</span>')+
    (mid>LAST_REAL?' <span class="est">· estimation</span>':"")+extra;
}

/* ================= LISTES ET PANNEAUX ================= */
function analyseDay(t0,t1){
  const wins=[];let start=null;
  for(let t=t0;t<=t1;t+=MIN){
    const above=height(t)>=thr;
    if(above&&start===null)start=t;
    if(!above&&start!==null){wins.push([start,t]);start=null;}
  }
  if(start!==null)wins.push([start,t1]);
  const ext=[];
  for(let i=Math.max(1,idxAfter(t0-1));i<N-1&&Tm[i]<t1;i++){if(Tm[i]>=t0)ext.push({t:Tm[i],v:Hm[i],hi:isHigh(i),est:EST[i]===1,c:CF[i]});}
  return {wins,ext};
}
function renderHeader(){
  const a=selDay(),b=addDays(a,1);
  $("dtxt").textContent=cap(fDL.format(new Date(a)));
  const cs=coefsOfDay(a,b);
  const bd=$("coefbadge");
  if(cs.length){
    bd.textContent="Coef "+cs.map(x=>(x.est?"~":"")+x.c).join(" · ");
    bd.style.background=coefColor(Math.max(...cs.map(x=>x.c)));
  }else{bd.textContent="Coef —";bd.style.background="#4a6a8a";}
  const m=ymd(a);$("date").value=m.y+"-"+pad(m.m+1)+"-"+pad(m.d);
  const mn=ymd(RANGE_MIN);$("date").min=mn.y+"-"+pad(mn.m+1)+"-"+pad(mn.d);$("date").max="2027-12-31";
  $("thrNum").value=thr;$("thrRange").value=thr;paintRange();
  $("thrLbl").textContent=n1(thr)+" m";
}
function paintRange(){const r=$("thrRange"),p=(thr/13)*100;r.style.background="linear-gradient(90deg,#8be8ff 0%,#2bc4ff "+p+"%,#27415f "+p+"%,#27415f 100%)";}
function renderList(){
  const box=$("list");box.innerHTML="";const base=selDay();
  for(let i=0;i<3;i++){
    const a=addDays(base,i),b=addDays(base,i+1);if(a>=RANGE_MAX)break;
    const {wins,ext}=analyseDay(a,b);
    const d=document.createElement("div");d.className="day";
    let h="<h3>"+cap(fDM.format(new Date(a)))+(a+12*HOUR>LAST_REAL?' <span class="est">· estimation</span>':"")+"</h3><div class=\"chips\">";
    if(!wins.length)h+='<span class="chip no">Jamais au-dessus du seuil</span>';
    else if(wins.length===1&&wins[0][0]===a&&wins[0][1]===b)h+='<span class="chip ok">Toute la journée</span>';
    else wins.forEach(w=>{h+='<span class="chip ok">'+(w[0]===a?"dès 00h00":hhmm(w[0]))+" → "+(w[1]===b?"minuit":hhmm(w[1]))+"</span>";});
    h+='</div><div class="small" style="margin-top:6px">'+ext.map(e=>(e.hi?"▲ PM ":"▼ BM ")+hhmm(e.t)+" ("+nf(e.v)+" m)"+(e.hi&&e.c?" coef "+(e.est?"~":"")+e.c:"")).join(" · ")+"</div>";
    d.innerHTML=h;box.appendChild(d);
  }
}
function renderWx(){
  const box=$("wx");if(!box)return;
  const sd=selDay(),se=addDays(sd,1);
  const w=dayWind(sd,se),s=daySwell(sd,se);
  const ev=sunEvents(sd),age=moonAge(sd+12*HOUR);
  let h='<div class="wgrid">';
  h+='<div class="wbox"><div class="lab">Vent du jour</div>';
  if(w){h+='<div class="val">'+arrowSvg(w.dir,windColor(w.avg))+Math.round(w.avg)+' <span style="font-size:.9rem;font-weight:600">km/h</span></div><div class="sub">du '+cardinal(w.dir)+" · rafales "+Math.round(w.gust)+" km/h</div>";}
  else h+='<div class="val">—</div><div class="sub">hors prévisions (8 jours)</div>';
  h+='</div><div class="wbox"><div class="lab">Houle du jour</div>';
  if(s)h+='<div class="val">🌊 '+n1(s.max)+' <span style="font-size:.9rem;font-weight:600">m max</span></div><div class="sub">moyenne '+n1(s.avg)+" m</div>";
  else h+='<div class="val">—</div><div class="sub">'+(SEA?"hors prévisions (8 jours)":"indisponible")+"</div>";
  h+='</div><div class="wbox"><div class="lab">Soleil</div><div class="val" style="font-size:1.2rem">☀️ '+hhmm(ev.rise)+" → "+hhmm(ev.set)+'</div><div class="sub">nuit noire en dehors de ces heures</div></div>';
  h+='<div class="wbox"><div class="lab">Lune</div><div class="val" style="font-size:1.1rem"><canvas id="moonc" width="64" height="64" style="width:32px;height:32px"></canvas>'+moonName(age).replace("Lune gibbeuse","Gibbeuse")+'</div><div class="sub">éclairée à '+Math.round((1-Math.cos(2*Math.PI*age))/2*100)+" %</div></div>";
  h+="</div>";
  // 8 jours
  h+='<div class="small" style="margin:2px 0 6px">Aujourd’hui et les 7 jours à venir</div><div class="strip">';
  const t0=dayStart(Date.now());
  for(let i=0;i<8;i++){
    const a=addDays(t0,i),b=addDays(a,1);
    if(a>=RANGE_MAX)break;
    const ww=dayWind(a,b),ss=daySwell(a,b),cs=coefsOfDay(a,b);
    h+='<div class="tile'+(a===sd?" sel":"")+'" data-t="'+a+'"><div class="d">'+fWD.format(new Date(a))+"</div>"+
      '<div class="w">'+(ww?arrowSvg(ww.dir,windColor(ww.avg),20)+Math.round(ww.avg):"—")+'<span style="font-size:.7rem;font-weight:600"> km/h</span></div>'+
      '<div class="h">'+(ss?"🌊 "+n1(ss.max)+" m":"🌊 —")+"</div>"+
      '<div class="c">'+(cs.length?"coef "+Math.max(...cs.map(x=>x.c)):"")+"</div></div>";
  }
  h+="</div>";
  box.innerHTML=h;
  const mc=$("moonc");if(mc){const c=mc.getContext("2d");c.clearRect(0,0,64,64);drawMoon(c,32,32,20,age);}
  box.querySelectorAll(".tile").forEach(el=>el.addEventListener("click",()=>{const t=+el.dataset.t;vStart=t;span=24*HOUR;cursor=null;refresh(true);}));
}
function refresh(full){
  clampView();draw();
  if(full){renderHeader();renderList();renderWx();}else{renderHeaderLight();}
}
function renderHeaderLight(){ // pendant le glissement : seulement la date et le coefficient
  const a=selDay();if(a!==renderHeaderLight.last){renderHeaderLight.last=a;renderHeader();}
}

/* ================= INTERACTIONS ================= */
function bind(){
  const ptrs=new Map();let lastX=0,pinchD=0,moved=0;
  wrap.addEventListener("pointerdown",e=>{
    wrap.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e.clientX);moved=0;lastX=e.clientX;
    if(ptrs.size===2){const v=[...ptrs.values()];pinchD=Math.abs(v[0]-v[1]);}
  });
  wrap.addEventListener("pointermove",e=>{
    const r=wrap.getBoundingClientRect();
    if(!ptrs.has(e.pointerId)){if(e.pointerType==="mouse"){cursor=tOf(e.clientX-r.left);draw();}return;}
    ptrs.set(e.pointerId,e.clientX);
    if(ptrs.size===2){
      const v=[...ptrs.values()],d=Math.abs(v[0]-v[1]);
      if(pinchD>0){const cx=(v[0]+v[1])/2-r.left,tc=tOf(cx);span=span*pinchD/d;vStart=tc-(cx-PAD.l)/(W-PAD.l-PAD.r)*span;}
      pinchD=d;moved=99;refresh(false);return;
    }
    const dx=e.clientX-lastX;lastX=e.clientX;moved+=Math.abs(dx);
    if(moved>4){vStart-=dx/(W-PAD.l-PAD.r)*span;cursor=null;refresh(false);}
  });
  function up(e){
    const was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);pinchD=0;if(!was)return;
    if(moved<=4&&ptrs.size===0){const r=wrap.getBoundingClientRect();cursor=tOf(e.clientX-r.left);}
    refresh(true);
  }
  wrap.addEventListener("pointerup",up);wrap.addEventListener("pointercancel",up);
  wrap.addEventListener("mouseleave",()=>{if(!ptrs.size){/* le curseur reste où il est */}});
  wrap.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=wrap.getBoundingClientRect(),cx=e.clientX-r.left,tc=tOf(cx);
    if(e.shiftKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){vStart+=(e.deltaX||e.deltaY)/W*span;}
    else{span*=e.deltaY>0?1.15:1/1.15;vStart=tc-(cx-PAD.l)/(W-PAD.l-PAD.r)*span;}
    refresh(true);
  },{passive:false});
  function setThr(v){
    v=parseFloat(String(v).replace(",","."));if(isNaN(v))return;
    thr=Math.max(0,Math.min(13,Math.round(v*100)/100));saveThr();
    $("thrRange").value=thr;paintRange();$("thrLbl").textContent=n1(thr)+" m";draw();renderList();
  }
  $("thrNum").addEventListener("input",e=>setThr(e.target.value));
  $("thrNum").addEventListener("change",e=>{$("thrNum").value=thr;});
  $("thrRange").addEventListener("input",e=>{setThr(e.target.value);$("thrNum").value=thr;});
  function shiftDay(n){const c=vStart+span/2,base=dayStart(c),off=c-base;vStart=addDays(base,n)+off-span/2;cursor=null;refresh(true);}
  $("prev").onclick=()=>shiftDay(-1);
  $("next").onclick=()=>shiftDay(1);
  $("date").addEventListener("change",e=>{
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value);if(!m)return;
    vStart=parisMidnight(+m[1],+m[2]-1,+m[3]);span=24*HOUR;cursor=null;refresh(true);
  });
  window.addEventListener("resize",resize);
}

/* ================= DÉMARRAGE DE L’APPLI ================= */
let started=false;
function startApp(){
  if(started)return;started=true;
  $("gate").style.display="none";$("app").style.display="block";
  cv=$("cv");ctx=cv.getContext("2d");wrap=$("wrap");
  $("foot").innerHTML="Marées : horaires et coefficients officiels du SHOM pour Saint-Malo (mêmes données que maree.info), heures de Paris, hauteurs au-dessus du zéro hydrographique. Entre deux pleines et basses mers la courbe est interpolée. <span class=\"est\">À partir de novembre 2027</span> les horaires ne sont pas encore publiés : courbe en pointillés et coefficients précédés de « ~ » = estimation. Vent : Open-Meteo à Saint-Malo, houle : modèle Open-Meteo au large (indicatif). Lever et coucher du soleil calculés.";
  vStart=Math.max(RANGE_MIN,dayStart(Date.now()));span=24*HOUR;
  bind();resize();clampView();renderHeader();renderList();renderWx();draw();
  loadWx();
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
}

/* ================= CODE D’ACCÈS ================= */
function deviceId(){let d=null;try{d=localStorage.getItem("maree-dev");}catch(e){}if(!d){d=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);try{localStorage.setItem("maree-dev",d);}catch(e){}}return d;}
async function checkCode(code){
  const url=ACCESS_URL+(ACCESS_URL.indexOf("?")>=0?"&":"?")+"code="+encodeURIComponent(code)+"&device="+encodeURIComponent(deviceId());
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch(url,{signal:ctl.signal});clearTimeout(to);return await r.json();}
  catch(e){clearTimeout(to);return {ok:false,network:true,message:"Pas de connexion. Réessaie quand tu as du réseau."};}
}
function showGate(msg){
  $("app").style.display="none";$("gate").style.display="flex";$("codeErr").textContent=msg||"";
  $("codeBtn").onclick=async()=>{
    const code=$("code").value.trim();if(!code){$("codeErr").textContent="Saisis ton code.";return;}
    $("codeBtn").disabled=true;$("codeErr").textContent="Vérification…";
    const r=await checkCode(code);$("codeBtn").disabled=false;
    if(r&&r.ok){try{localStorage.setItem("maree-access",JSON.stringify({code:code,nom:r.nom||"",ok:Date.now()}));}catch(e){}startApp();}
    else $("codeErr").textContent=(r&&r.message)||"Code refusé.";
  };
  $("code").onkeydown=e=>{if(e.key==="Enter")$("codeBtn").click();};
}
async function boot(){
  if(!ACCESS_URL){startApp();return;}
  let st=null;try{st=JSON.parse(localStorage.getItem("maree-access")||"null");}catch(e){}
  if(!st||!st.code){showGate("");return;}
  const r=await checkCode(st.code);
  if(r&&r.ok){try{st.ok=Date.now();localStorage.setItem("maree-access",JSON.stringify(st));}catch(e){}startApp();return;}
  if(r&&r.network){ // hors ligne : on tolère 14 jours depuis la dernière vérification réussie
    if(Date.now()-(st.ok||0)<14*DAY){startApp();return;}
    showGate("Connexion nécessaire pour vérifier ton accès.");return;
  }
  try{localStorage.removeItem("maree-access");}catch(e){}
  showGate((r&&r.message)||"Accès refusé.");
}
boot();
})();
</script>
